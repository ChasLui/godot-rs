# Runs on every push and pull request.
#
# The integration tests need a real Godot binary, so the engine is downloaded rather than
# mocked: a binding is only correct if the engine agrees, and nothing short of running it
# proves that.

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Lets a run be started by hand, which is how the engine-download steps get
  # re-checked when a new Godot patch release appears.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Must match godot-sys/gdextension/VERSION; the bindings are generated against this dump.
  GODOT_VERSION: 4.7.2

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: format and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: |
          cargo clippy --workspace -- \
            -D clippy::style -D clippy::complexity -D clippy::perf \
            -D clippy::dbg_macro -D clippy::todo -D clippy::unimplemented -D warnings

  unit-tests:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  integration-tests:
    name: integration tests (Godot ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            godot_platform: linux.x86_64
            lib: libitest.so
          - os: macos-latest
            godot_platform: macos.universal
            lib: libitest.dylib
          - os: windows-latest
            godot_platform: win64.exe
            lib: itest.dll
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Download Godot ${{ env.GODOT_VERSION }}
        run: |
          # The asset names do not follow one rule: macOS ships an .app bundle, Linux a bare
          # executable, Windows an .exe whose platform tag already contains ".exe".
          url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_${{ matrix.godot_platform }}.zip"
          curl -L -o godot.zip "$url"
          unzip -q godot.zip -d godot-bin
          if [[ "${{ matrix.os }}" == macos-* ]]; then
            echo "GODOT4_BIN=$PWD/godot-bin/Godot.app/Contents/MacOS/Godot" >> "$GITHUB_ENV"
          elif [[ "${{ matrix.os }}" == windows-* ]]; then
            # The Windows archive ships two executables; the console one writes its output to
            # stdout, which is what the tests read.
            binary=$(find godot-bin -maxdepth 1 -type f -name 'Godot_v*_console.exe' | head -1)
            echo "GODOT4_BIN=$PWD/$binary" >> "$GITHUB_ENV"
          else
            binary=$(find godot-bin -maxdepth 1 -type f -name 'Godot_v*' | head -1)
            chmod +x "$binary"
            echo "GODOT4_BIN=$PWD/$binary" >> "$GITHUB_ENV"
          fi

      - name: Verify the engine matches the vendored API dump
        run: |
          expected=$(cut -d. -f1-3 < godot-sys/gdextension/VERSION)
          actual=$("$GODOT4_BIN" --headless --version | cut -d. -f1-3)
          if [[ "$expected" != "$actual" ]]; then
            echo "engine is $actual but the bindings were generated from $expected"
            exit 1
          fi

      - name: Build the test extension
        run: cargo build -p itest

      - name: Run integration tests
        run: ./check.sh itest

      - name: Run editor-mode tests
        run: ./check.sh etest

  examples:
    name: examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Download Godot ${{ env.GODOT_VERSION }}
        run: |
          url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -L -o godot.zip "$url"
          unzip -q godot.zip -d godot-bin
          binary=$(find godot-bin -maxdepth 1 -type f -name 'Godot_v*' | head -1)
          chmod +x "$binary"
          echo "GODOT4_BIN=$PWD/$binary" >> "$GITHUB_ENV"

      - run: cargo build -p hello-world -p counter -p bouncing-ball

      # bouncing-ball checks its own physics headlessly and sets the exit code, so it is run
      # rather than only compiled.
      - name: Run the bouncing-ball example
        run: |
          target=$(cargo metadata --format-version 1 --no-deps \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["target_directory"])')
          cp "$target/debug/libbouncing_ball.so" examples/bouncing-ball/godot/lib/
          # First run scans the project; the exit code of that scan is not meaningful.
          "$GODOT4_BIN" --headless --path examples/bouncing-ball/godot --editor --quit >/dev/null 2>&1 || true
          "$GODOT4_BIN" --headless --path examples/bouncing-ball/godot
