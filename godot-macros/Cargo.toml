[package]
name = "godot-macros"
description = "Procedural macros for the godot crate."
version = "0.1.0"
license = "MIT"
workspace = ".."
edition = "2021"
rust-version = "1.70"
publish = false

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "extra-traits"] }
