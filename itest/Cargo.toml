[package]
name = "itest"
description = "Integration tests run inside a real Godot 4 instance."
version = "0.1.0"
license = "MIT"
workspace = ".."
edition = "2021"
rust-version = "1.70"
publish = false

[lib]
crate-type = ["cdylib"]

[features]
default = []
# Builds the editor half of the suite: a Rust EditorPlugin. Off by default so the ordinary
# game-mode run stays on the same configuration a shipped extension uses.
editor = ["godot/editor"]

[dependencies]
godot = { path = "../godot", version = "0.1.0" }
